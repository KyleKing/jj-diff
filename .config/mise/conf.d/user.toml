# Project-specific tasks. Files in conf.d are loaded alphabetically and the last
# definition wins, so this must sort after template.toml to override it. Do not
# rename it to anything sorting before "template".
#
# build, test, and clean come from template.toml.

# tests/integration drives a real jj binary and skips itself when one is absent.
# This pin makes `mise install` provide it. It does not reach the ci job, which
# sets MISE_TASK_RUN_AUTO_INSTALL=false.
[tools]
jj = "latest"

[tasks.deps]
description = "Download and tidy Go modules"
run = "go mod download && go mod tidy"

[tasks.install]
description = "Build and install jj-diff"
depends = ["build"]
run = "go install ./cmd/jj-diff"

[tasks.run]
description = "Build and run jj-diff"
depends = ["build"]
run = "./jj-diff"
